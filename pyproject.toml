[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slashlint"
version = "0.1.0"
description = "Static analyzer for discord.py bots: finds slash commands that will time out before responding."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "brann14" }]
keywords = ["discord", "discord.py", "linter", "static-analysis", "ast"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
slashlint = "slashlint.cli:main"

[project.urls]
Homepage = "https://github.com/brann14/slashlint"
Issues = "https://github.com/brann14/slashlint/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/slashlint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fixtures are inputs to the parser, never imported. Keep pytest away from them.
norecursedirs = ["tests/fixtures"]
addopts = "-q"
